# host nginx vhost for production. install with:
#   sudo cp extras/conf/nginx-brc.conf /etc/nginx/sites-available/brc
#   sudo ln -s /etc/nginx/sites-available/brc /etc/nginx/sites-enabled/brc
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is terminated by Cloudflare, so every domain here must be proxied (orange cloud).
# the ports must match NGINX_HOST_PORT and SOCKET_HOST_PORT in .env
server {
	listen 80;
	listen [::]:80;

	server_name app.uoficoc.com brc.ramseyer.dev brc.churchinfairborn.org;
	client_max_body_size 10M;

	location / {
		proxy_pass http://127.0.0.1:9090;
		proxy_set_header Host $http_host;
	}

	location /socket {
		proxy_pass http://127.0.0.1:9095;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_cache_bypass $http_upgrade;
	}
}
